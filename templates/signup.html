{% extends "base.html" %} {% block title %}Sign Up{% endblock %} {% block
content %}

  <form class="auth-form" action="/signup" method="POST">
    <div class="auth-heading">
      <p class="eyebrow">Join the kitchen</p>
      <h1>Create your account</h1>
    </div>


    <div class="">
      <div class="form-field">
        <label for="first_name">First name</label>
        <input type="text" id="first_name" name="first_name" placeholder="First name" required/>
      </div>

      <div class="form-field">
        <label for="last_name">Last name</label>
        <input type="text" id="last_name" name="last_name"placeholder="Last name" required/>
      </div>
    </div>

    <div class="form-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required/>
    </div>

    <div class="form-field">
      <label for="role">Account type</label>
      <select id="role" name="role" required>
        <option value="">Choose an account type</option>
        <option value="student">Student</option>
        <option value="manager">Manager</option>
      </select>
    </div>

    <div class="name-fields">
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          required
        />
      </div>

      <div class="form-field">
        <label for="password2">Confirm password</label>
        <input
          type="password"
          id="password2"
          name="password2"
          placeholder="Repeat password"
          required
        />
      </div>
    </div>

    <button class="auth-button" type="submit">Create account</button>
  </form>


{% endblock%}
